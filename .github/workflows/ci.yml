name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - name: Compute release metadata
        id: version
        run: |
          VERSION="$(date -u +'%Y.%m.%d')-$(git rev-parse --short HEAD)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
          lfs: true
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          cache-suffix: ${{ github.job }}
      - run: uv sync --extra dev
      - run: uv run ruff check
      - run: uv run ruff format --check

  python-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
          lfs: true
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          cache-suffix: ${{ github.job }}
      - run: uv sync --extra dev
      - run: uv run pytest -x -q
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

  # The installed wheel loads IFBench from the bundled
  # `scoring/ifbench/_upstream` copy (force-included at build time); the editable
  # installs above only hit the submodule fallback. Do a non-editable install
  # (mirrors the Docker build) and import through the bundled path, so a
  # packaging regression in the force-include block is caught.
  wheel-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
          lfs: true
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          cache-suffix: ${{ github.job }}
      - name: Non-editable install (mirrors the Docker build)
        run: uv sync --package pipette-scores --frozen --no-dev --no-editable
      - name: Import IFBench through the bundled _upstream copy
        run: |
          .venv/bin/python - <<'PY'
          from pipette_scores.scoring.ifbench.upstream import test_instruction_following_loose
          from pipette_scores.scoring.ifbench._upstream import evaluation_lib
          f = evaluation_lib.__file__.replace("\\", "/")
          assert "site-packages" in f, f"not from installed pkg: {f}"
          assert "scoring/ifbench/_upstream" in f, f"not the bundled copy: {f}"
          assert callable(test_instruction_following_loose)
          print("bundled IFBench _upstream OK:", f)
          PY

  # Per-arch Docker build on a native runner (no qemu). The image is built to
  # prove the Dockerfile still works, but never published: this repository
  # does not release. Publishing happens upstream.
  docker-image-build:
    needs: [release-metadata, python-lint, python-test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
          - os: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
          lfs: true
      - uses: docker/setup-buildx-action@v4
      # No registry login: nothing from this repository is pushed anywhere.
      - name: Build image (never pushed)
        id: build
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: docker/pipette-scores.Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            APP_VERSION=${{ needs.release-metadata.outputs.version }}
          # Build only. Never `push=true`, on any branch or event.
          outputs: type=cacheonly
          # Per-arch + per-branch cache scope, with main as fallback so cold
          # PRs warm-start from the latest main cache.
          cache-from: |
            type=gha,scope=docker-${{ matrix.arch }}-${{ github.ref_name }}
            type=gha,scope=docker-${{ matrix.arch }}-main
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.arch }}-${{ github.ref_name }}
