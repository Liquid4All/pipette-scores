[project]
name = "pipette-calibration"
version = "0.1.0"
description = "Calibration pipeline and dataset management for pipette-scores"
requires-python = ">=3.12,<3.14"
authors = [{name = "Liquid AI"}]

dependencies = [
    "pipette-scores",
    "datasets>=2.14.0",
    "tqdm>=4.66.0",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8.0"]

[dependency-groups]
gpu = [
    "vllm>=0.19.0; sys_platform == 'linux'",
    # Required by transformers' TimmWrapperModel, which Gemma 3n pulls in.
    "timm>=1.0; sys_platform == 'linux'",
    # 5.5.1+ is the first release that ships Gemma4ForConditionalGeneration
    # (model_type="gemma4" — unsloth/gemma-4-*). vLLM 0.19.1 accepts >=5.5.1.
    "transformers>=5.5.1; sys_platform == 'linux'",
]

[project.scripts]
pipette-calibration = "pipette_calibration.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipette_calibration"]

[tool.uv.sources]
pipette-scores = { workspace = true }
